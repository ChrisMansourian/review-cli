name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12"]
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: pip install -e .
      - name: Run unit tests
        run: python -m unittest discover tests -v

  review:
    name: reviewer audit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e .
      - name: Generate SARIF
        env:
          BASE_REF: ${{ github.base_ref }}
        run: reviewer --base "origin/${BASE_REF}" --format sarif > reviewer.sarif || true
      - name: Upload SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reviewer.sarif
          category: reviewer
      - name: Annotate pull request
        env:
          BASE_REF: ${{ github.base_ref }}
        run: reviewer --base "origin/${BASE_REF}" --format github || true
      - name: Run reviewer
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set +e
          reviewer --base "origin/${BASE_REF}" --format markdown > reviewer-summary.md
          status=$?
          set -e
          cat reviewer-summary.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
